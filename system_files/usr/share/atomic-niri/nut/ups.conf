# Member's Selection ST-1500MS over USB. `ujust setup-nut` adds this section
# to /etc/ups/ups.conf.
#
# The board reports no runtime, so runtimecal is a measured curve (240 s at
# full load, 660 s at half), and the overrides fix the make, model and ratings
# it gets wrong.

[st1500]
    pollfreq = 2
    driver = nutdrv_qx
    port = auto
    vendorid = 0665
    productid = 5161
    desc = "Member's Selection ST-1500MS"
    runtimecal = 240,100,660,50
    override.device.mfr = "Member's Selection"
    override.device.model = "ST-1500MS"
    override.ups.mfr = "Member's Selection"
    override.ups.model = "ST-1500MS"
    override.ups.power.nominal = 1500
    override.ups.realpower.nominal = 900
