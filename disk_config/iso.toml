# The installer ISO (just build-iso, or the "Build disk images" workflow).
#
# The installer copies the image from the ISO; %post then points the system at
# the registry, so updates come from GHCR, signature-checked against our key.

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --enforce-container-sigpolicy --transport registry ghcr.io/osc100/atomic-personal-niri:latest
%end
"""

# Users, timezone and network stay on: nothing on this image sets them up at
# first boot, as GNOME's initial setup does on ublue's desktop images.
[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Localization",
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
